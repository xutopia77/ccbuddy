name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
          - os: macos-latest
            platform: darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps (Tauri)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build (app + hook)
        run: python scripts/build.py

      # macOS 额外交叉编译另一个架构的 hook（x86_64 / aarch64 各一份）
      - name: Build hook for other macOS arch
        if: matrix.platform == 'darwin'
        run: |
          TARGET=$(if [ "$(uname -m)" = "arm64" ]; then echo x86_64-apple-darwin; else echo aarch64-apple-darwin; fi)
          rustup target add "$TARGET"
          cargo build --release --bin ccbuddy-hook --target "$TARGET"
          EXT=$(if [[ "$TARGET" == *windows* ]]; then echo .exe; else echo ""; fi)
          cp "src-tauri/target/$TARGET/release/ccbuddy-hook$EXT" \
             "dist-release/ccbuddy-hook-darwin-$(echo $TARGET | cut -d- -f1).out"
          rm "dist-release/ccbuddy-hook-darwin-$(uname -m)"
          mv "dist-release/ccbuddy-hook-darwin-$(echo $TARGET | cut -d- -f1).out" \
             "dist-release/ccbuddy-hook-darwin-$(echo $TARGET | cut -d- -f1)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ccbuddy-${{ matrix.platform }}
          path: dist-release/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: List files
        run: ls -la dist-release/

      - name: Create Release & Upload
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist-release/*
