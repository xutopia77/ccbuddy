name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
          - os: macos-latest
            platform: darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps (Tauri)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build (app + hook)
        run: python scripts/build.py

      # macOS 额外交叉编译另一个架构的 hook（x86_64 / aarch64 各一份）
      - name: Build hook for other macOS arch
        if: matrix.platform == 'darwin'
        run: |
          # 当前机器架构对应的文件名后缀（build.py 输出用 aarch64，不是 arm64）
          CURRENT_ARCH=$(if [ "$(uname -m)" = "arm64" ]; then echo aarch64; else echo x86_64; fi)
          # 需要交叉编译的目标 triple
          TARGET=$(if [ "$(uname -m)" = "arm64" ]; then echo x86_64-apple-darwin; else echo aarch64-apple-darwin; fi)
          TARGET_ARCH=$(echo "$TARGET" | cut -d- -f1)

          echo "Current arch: $CURRENT_ARCH"
          echo "Cross target:  $TARGET ($TARGET_ARCH)"

          rustup target add "$TARGET"
          cargo build --release --bin ccbuddy-hook --target "$TARGET" \
            --manifest-path src-tauri/Cargo.toml

          # 交叉编译产物直接复制到最终文件名，与 build.py 产出的当前架构文件共存
          cp "src-tauri/target/$TARGET/release/ccbuddy-hook" \
             "dist-release/ccbuddy-hook-darwin-${TARGET_ARCH}"

          echo "Final hook files in dist-release:"
          ls -la dist-release/ccbuddy-hook-darwin-*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ccbuddy-${{ matrix.platform }}
          path: dist-release/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: List files
        run: ls -la dist-release/

      - name: Create Release & Upload
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist-release/*
