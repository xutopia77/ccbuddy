[package]
name = "ccbuddy"
version = "0.1.0"
description = "Claude Code session monitor"
authors = ["xutopia77"]
edition = "2021"
default-run = "ccbuddy"

[features]
# 桌面 GUI（Tauri）。服务器等无桌面环境构建 ccbuddy-server 时用 --no-default-features 关闭。
default = ["gui"]
gui = ["tauri", "tauri-plugin-opener", "windows"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ccbuddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
# SSE 推送流（/api/events），tokio 流工具
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
include_dir = "0.7"
# server 访问密码哈希存储（Argon2id：内存难解、抗 GPU 爆破）
argon2 = "0.5"
# 仅为生成 Argon2 随机盐提供 OsRng（argon2 默认引入的 rand_core 关了 getrandom）
rand_core = { version = "0.6", features = ["getrandom"] }
# ccbuddy-server --set-password 的交互式密码输入（终端不回显）
rpassword = "7"

# 任务栏通知（overlay 角标 / FlashWindowEx），仅桌面端使用
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "ccbuddy"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "ccbuddy-hook"
path = "src/bin/ccbuddy-hook.rs"

# 无头服务端（无桌面环境的 Linux 服务器）：cargo build --no-default-features --bin ccbuddy-server
[[bin]]
name = "ccbuddy-server"
path = "src/bin/ccbuddy-server.rs"

