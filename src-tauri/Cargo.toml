[package]
name = "ccbuddy"
version = "0.1.0"
description = "Claude Code session monitor"
authors = ["xutopia77"]
edition = "2021"
default-run = "ccbuddy"

[features]
# 桌面 GUI（Tauri）。服务器等无桌面环境构建 ccbuddy-server 时用 --no-default-features 关闭。
default = ["gui"]
gui = ["tauri", "tauri-plugin-opener"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ccbuddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
include_dir = "0.7"
# hook 自动下载（GitHub latest release），轻量同步 HTTP 客户端
ureq = "2"

[[bin]]
name = "ccbuddy"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "ccbuddy-hook"
path = "src/bin/ccbuddy-hook.rs"

# 无头服务端（无桌面环境的 Linux 服务器）：cargo build --no-default-features --bin ccbuddy-server
[[bin]]
name = "ccbuddy-server"
path = "src/bin/ccbuddy-server.rs"

